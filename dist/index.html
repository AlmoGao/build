  <script>
    // 兼容兜底：安全 sessionStorage/matchMedia
    (function () {
      function getStorage() {
        try {
          return window.sessionStorage;
        } catch (e) {
          return null;
        }
      }
      window.__sessionSafe = {
        getItem: function (key) {
          try {
            var s = getStorage();
            return s ? s.getItem(key) : null;
          } catch (e) {
            return null;
          }
        },
        setItem: function (key, value) {
          try {
            var s = getStorage();
            if (s) s.setItem(key, value);
          } catch (e) { }
        },
        removeItem: function (key) {
          try {
            var s = getStorage();
            if (s) s.removeItem(key);
          } catch (e) { }
        },
        clear: function () {
          try {
            var s = getStorage();
            if (s) s.clear();
          } catch (e) { }
        }
      };
      window.__safeMatchMedia = function (query) {
        try {
          if (typeof window.matchMedia !== 'function') return false;
          return !!window.matchMedia(query).matches;
        } catch (e) {
          return false;
        }
      };
    })();

    // 解析参数
    const keys = [
      "inviteCode"
    ];
    keys.forEach((item) => {
      getQueryFromUrl(item);
    });
    function getQueryFromUrl(key) {
      try {
        if (location.search.includes(key)) {
          let str = location.search.split(key + "=")[1].split("&")[0];
          if (
            str == null ||
            str == undefined ||
            str == "null" ||
            str == "undefined"
          ) {
            str = "";
          }
          console.error('邀请码', decodeURIComponent(str))
          localStorage.setItem(key, decodeURIComponent(str));
        } else if (location.href.includes('?')) {
          const s = location.href.split('?')[1]
          if (s) {
            let str = s.split(key + "=")[1].split("&")[0];
            if (
              str == null ||
              str == undefined ||
              str == "null" ||
              str == "undefined"
            ) {
              str = "";
            }
            console.error('邀请码2', decodeURIComponent(str))
            localStorage.setItem(key, decodeURIComponent(str));
          }
        }
      } catch { }
    }
  </script>

  <script>
    (function () {
      // 每次启动清理旧的 ready 标记，避免刷新时立即命中而出现空白
      try { window.__sessionSafe && window.__sessionSafe.removeItem('app_loaded') } catch (e) { }
      var ready = { load: false, app: false }
      var hidden = false
      function hidePreLoading() {
        if (hidden) return
        var el = document.getElementById('pre-loading')
        if (el && el.parentNode) {
          el.style.display = 'none'
          el.parentNode.removeChild(el)
        }
        hidden = true
      }
      function tryHide() {
        if (ready.load && ready.app) hidePreLoading()
      }
      // 1. window.load：所有同步 JS/CSS/资源加载完
      if (document.readyState === 'complete') {
        ready.load = true
      } else {
        window.addEventListener('load', function () {
          ready.load = true; tryHide()
        })
      }
      // 2. App 首屏挂载完成事件
      window.addEventListener('app:ready', function () {
        ready.app = true; tryHide()
      })
      // 3. sessionStorage 兜底轮询（兼容已有信号 / 缓存路径）
      var pollTimer = setInterval(function () {
        try {
          if (window.__sessionSafe && window.__sessionSafe.getItem('app_loaded')) {
            ready.app = true
            tryHide()
          }
        } catch (e) { }
        if (hidden) {
          clearInterval(pollTimer); pollTimer = null
        }
      }, 200)
      // 4. 最长 60s 兜底，避免接口异常时白屏
      setTimeout(hidePreLoading, 60000)
      // 立即尝试一次
      tryHide()
    })()
  </script>
