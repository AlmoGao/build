  <script>
    (function () {
      var envCode = 'main'
      if (['rwa_283'].includes(envCode)) {
        const viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) {
          viewport.setAttribute(
            'content',
            'width=1460'
          );
        }
        return
      }
      if (
        ['main'].includes(envCode) ||
        /mode\d+$/.test(envCode)
      ) {
        return
      }
      var ua = navigator.userAgent.toLowerCase();
      var isMobile = /iphone|ipad|ipod|android|mobile/i.test(ua);
      if (isMobile) {
        const url = location.origin
        const match = url.match(/^(\w+:\/\/)([^/]+)$/);
        if (!match) return url;
        const protocol = match[1];
        const host = match[2];
        const parts = host.split('.');
        if (parts.length > 2) {
          parts[0] = 'h5';
        } else {
          parts.unshift('h5');
        }
        if (!['icmarkets'].includes('main')) {
          parts.shift()
        }
        if (['icmarkets'].includes('main') && ['286'].includes('%VITE_ENV_SUBCODE%')) {
          parts.shift()
        }
        if (location.href.includes('?')) {
          window.location.href = protocol + parts.join('.') + '?' + location.href.split('?')[1]
        } else {
          window.location.href = protocol + parts.join('.')
        }
      }
    })();
  </script>

  <script>
    let interval = setInterval(() => {
      pageLoadedCheck()
    }, 500)
    pageLoadedCheck()
    function pageLoadedCheck() {
      const loaded = sessionStorage.getItem('page_loaded')
      if (loaded) {
        const loadingBox = document.querySelector('#pre-loading')
        if (loadingBox) {
          if (interval) {
            clearInterval(interval)
          }
          interval = null
          loadingBox.style.display = 'none'
          document.body.removeChild(loadingBox)
        }
      }
    }
  </script>
  <script>
    // 动态主题
    const sunx = localStorage.getItem("sunx");
    if (sunx) {
      try {
        const theme = JSON.parse(sunx).theme;
        if (theme) {
          document.body.classList.remove("body-light", "body-dark");
          document.body.classList.add(`body-${theme}`);
        }
      } catch { }
    }

    // 解析参数
    const keys = ["inviteCode", "theme"];
    keys.forEach((item) => {
      getQueryFromUrl(item);
    });
    function getQueryFromUrl(key) {
      try {
        if (location.search.includes(key)) {
          let str = location.search.split(key + "=")[1].split("&")[0];
          if (
            str == null ||
            str == undefined ||
            str == "null" ||
            str == "undefined"
          ) {
            str = "";
          }
          localStorage.setItem(key, decodeURIComponent(str));
          return decodeURIComponent(str)
        }
      } catch {
        console.error(key + "获取失败");
      }
    }
  </script>
