name: Tauri Windows Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. Rust 缓存
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      # 5. 查看环境版本
      - name: Show Environment Versions
        shell: powershell
        run: |
          Write-Host "===== Node ====="
          node -v

          Write-Host "===== NPM ====="
          npm -v

          Write-Host "===== Rust ====="
          rustc --version

          Write-Host "===== Cargo ====="
          cargo --version

          Write-Host "===== Tauri CLI ====="
          npm list @tauri-apps/cli --depth=0

          Write-Host "===== Check dist ====="
          if (Test-Path "dist/index.html") {
            Write-Host "dist/index.html exists"
          } else {
            Write-Host "ERROR: dist/index.html NOT FOUND"
            exit 1
          }

          Write-Host "===== dist files ====="
          Get-ChildItem dist -Recurse | Select-Object FullName

      # 6. 严格按照 package-lock.json 安装
      - name: Install npm dependencies
        run: npm ci

      # 7. 确认 Tauri CLI
      - name: Check Tauri CLI
        run: npx tauri --version

      # 8. 不执行 npm run build
      # 因为 dist 已经是构建好的 Vue 页面
      - name: Build Tauri
        run: npm run tauri:build

      # 9. 查看打包结果
      - name: List Build Artifacts
        shell: powershell
        run: |
          Write-Host "===== Bundle ====="

          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem `
              -Path "src-tauri/target/release/bundle" `
              -Recurse
          } else {
            Write-Host "ERROR: bundle directory NOT FOUND"
            exit 1
          }

      # 10. 发布 GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}