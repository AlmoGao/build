name: Tauri Windows Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. 安装 Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. 缓存 Rust
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      # 5. 输出环境版本
      - name: Show Environment Versions
        shell: powershell
        run: |
          Write-Host "===== Node ====="
          node -v

          Write-Host "===== NPM ====="
          npm -v

          Write-Host "===== Rust ====="
          rustc --version

          Write-Host "===== Cargo ====="
          cargo --version

          Write-Host "===== Tauri CLI ====="
          npm list @tauri-apps/cli --depth=0

          Write-Host "===== Tauri API ====="
          npm list @tauri-apps/api --depth=0

      # 6. 安装前端依赖
      # 严格按照 package-lock.json 安装
      - name: Install npm dependencies
        run: npm ci

      # 7. 构建前端
      - name: Build Frontend
        run: npm run build

      # 8. 构建 Tauri Windows
      # 使用 package.json 中配置的 tauri:build
      - name: Build Tauri Windows
        run: npm run tauri:build

      # 9. 查看构建产物
      - name: List Build Artifacts
        shell: powershell
        run: |
          Write-Host "===== Tauri Bundle ====="
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse

      # 10. 发布 GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}