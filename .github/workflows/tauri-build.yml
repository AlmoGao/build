name: Tauri Windows Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. 安装 Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. 缓存 Rust
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      # 5. 查看版本
      - name: Show Environment Versions
        run: |
          node -v
          npm -v
          rustc --version
          cargo --version
          npm list @tauri-apps/cli --depth=0

      # 6. 安装依赖
      - name: Install npm dependencies
        run: npm ci

      # 7. 查看 Tauri CLI
      - name: Check Tauri CLI
        run: npx tauri --version

      # 8. 直接使用现有 dist 打包
      - name: Build Tauri Windows
        run: npm run tauri:build

      # 9. 发布 GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}