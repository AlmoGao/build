name: Tauri Windows Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. 安装 Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. 缓存 Rust
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      # 5. 输出环境版本
      - name: Show Environment Versions
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Node"
          Write-Host "========================================"
          node -v

          Write-Host "========================================"
          Write-Host "NPM"
          Write-Host "========================================"
          npm -v

          Write-Host "========================================"
          Write-Host "Rust"
          Write-Host "========================================"
          rustc --version

          Write-Host "========================================"
          Write-Host "Cargo"
          Write-Host "========================================"
          cargo --version

          Write-Host "========================================"
          Write-Host "Tauri CLI"
          Write-Host "========================================"
          npm list @tauri-apps/cli --depth=0
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Tauri CLI package not found in node_modules"
            $LASTEXITCODE = 0
          }

          Write-Host "========================================"
          Write-Host "Tauri API"
          Write-Host "========================================"
          npm list @tauri-apps/api --depth=0
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Tauri API package not found in node_modules"
            $LASTEXITCODE = 0
          }

          Write-Host "========================================"
          Write-Host "package.json"
          Write-Host "========================================"
          Get-Content package.json

          Write-Host "========================================"
          Write-Host "Tauri dependencies in package-lock.json"
          Write-Host "========================================"

          if (Test-Path package-lock.json) {
            Select-String `
              -Path package-lock.json `
              -Pattern "@tauri-apps/cli|@tauri-apps/api"
          } else {
            Write-Host "package-lock.json NOT FOUND"
          }

      # 6. 安装 npm 依赖
      # 严格按照 package-lock.json 安装
      - name: Install npm dependencies
        run: npm ci

      # 7. 再次检查实际安装的依赖
      - name: Verify Dependencies
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Installed Tauri CLI"
          Write-Host "========================================"

          npm list @tauri-apps/cli --depth=0

          Write-Host "========================================"
          Write-Host "Installed Tauri API"
          Write-Host "========================================"

          npm list @tauri-apps/api --depth=0

          Write-Host "========================================"
          Write-Host "Installed packages"
          Write-Host "========================================"

          npm list --depth=0

      # 8. 检查 Tauri CLI
      - name: Check Tauri CLI
        shell: powershell
        run: |
          Write-Host "Checking Tauri CLI..."

          npx tauri --version

      # 9. 构建 Vue 前端
      - name: Build Frontend
        run: npm run build

      # 10. 构建 Tauri Windows
      - name: Build Tauri Windows
        run: npm run tauri:build

      # 11. 查看构建产物
      - name: List Build Artifacts
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Tauri Build Output"
          Write-Host "========================================"

          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem `
              -Path "src-tauri/target/release/bundle" `
              -Recurse
          } else {
            Write-Host "Tauri bundle directory NOT FOUND"
            exit 1
          }

      # 12. 发布 GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}